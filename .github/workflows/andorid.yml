name: Build test apk

on:
  push:
    branches: [ "staging" ]
  pull_request:
    types: [closed]
    branches: [ "staging" ]

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
      EXPO_PUBLIC_BACKEND_WEBSOCKET_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_WEBSOCKET_URL }}
      EXPO_PUBLIC_DELIVERY_FEE_PER_100_METER: ${{ secrets.EXPO_PUBLIC_DELIVERY_FEE_PER_100_METER }}

    steps:
      - name: Checkout of Repository
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Restore Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Generate Native Files
        run: npx expo prebuild --clean --platform android

      # Decode the production keystore into the generated folder structure.
      # tr -d strips any stray whitespace/newlines so a trailing newline in the
      # secret can't corrupt the decoded keystore.
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 --decode > android/app/release-keystore.jks
      
      - name: Verify Keystore
        run: |
          keytool -list -keystore android/app/release-keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias tapmark-upload

      # Build the AAB (signing config is applied by the withAndroidSigning plugin,
      # which reads credentials from the env vars below)
      - name: Build and Sign AAB
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: tapmark-upload
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 3

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.TapMark.regular
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
